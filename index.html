<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>justjump.lol</title>
<style>
  :root {
    --sky-a: #7fc8ff;
    --sky-b: #e8f7ff;
    --water: #1e6fa8;
    --water-deep: #155580;
    --board: #8a5a2b;
    --metal: #4a4a4a;
    --man: #1c1c1c;
    --rock: #7c848a;
    --ketchup: #c8102e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-a: #0b2540; --sky-b: #173a5e;
      --water: #0c3a5c; --water-deep: #06253c;
      --board: #6b4423; --metal: #2a2a2a; --man: #e8e8e8;
      --rock: #4e565b; --ketchup: #a50d25;
    }
  }
  :root[data-theme="dark"] {
    --sky-a: #0b2540; --sky-b: #173a5e;
    --water: #0c3a5c; --water-deep: #06253c;
    --board: #6b4423; --metal: #2a2a2a; --man: #e8e8e8;
    --rock: #4e565b; --ketchup: #a50d25;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(var(--sky-a), var(--sky-b));
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #stage { position: relative; width: 100%; height: 100vh; overflow: hidden; }

  /* ---------- title ---------- */
  h1 {
    position: absolute; top: 4vh; left: 50%; translate: -50% 0;
    margin: 0; z-index: 5; white-space: nowrap; user-select: none;
    font: 800 clamp(28px, 7vw, 64px)/1 "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    color: var(--man);
  }
  h1 span { color: var(--water); }

  /* ---------- water ---------- */
  #water {
    position: absolute; inset: auto 0 0 0; height: 14%;
    background: linear-gradient(var(--water), var(--water-deep));
  }
  #water::before {
    content: ""; position: absolute; top: -5px; left: 0; width: 200%; height: 10px;
    background: repeating-linear-gradient(90deg,
      transparent 0 20px, color-mix(in srgb, var(--water) 55%, white) 20px 40px);
    opacity: .45;
    animation: drift 3s linear infinite;
  }
  @keyframes drift { to { translate: -40px 0; } }

  /* ---------- ladder + diving board ---------- */
  #rig { position: absolute; top: 12%; left: 8%; }

  .ladder { position: absolute; top: 0; left: 0; width: 56px; height: 74vh; }
  .rail {
    position: absolute; top: 0; width: 9px; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--metal) 60%, white), var(--metal),
      color-mix(in srgb, var(--metal) 60%, black));
  }
  .rail.r { right: 0; }
  .rungs {
    position: absolute; left: 7px; right: 7px; top: 16px; bottom: 0;
    background: repeating-linear-gradient(180deg,
      color-mix(in srgb, var(--metal) 55%, white) 0 4px,
      transparent 4px 26px);
  }

  #board {
    position: absolute; top: 0; left: 52px;
    width: 104px; height: 11px; transform-origin: left center;
    border-radius: 2px 9px 9px 2px;
    background:
      repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--board) 88%, white) 0 3px,
        color-mix(in srgb, var(--board) 68%, black) 3px 4px);
    box-shadow: 0 4px 7px rgba(0,0,0,.28);
  }
  #board::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 13px;
    border-radius: 2px 0 0 2px;
    background: color-mix(in srgb, var(--board) 50%, black);
  }
  #tip { position: absolute; top: 0; left: 150px; width: 1px; height: 1px; }

  /* ---------- rock ---------- */
  #rock {
    position: absolute; left: 0; bottom: 0; width: 54%; height: 34%;
    background: linear-gradient(155deg,
      color-mix(in srgb, var(--rock) 130%, white) 0%,
      var(--rock) 45%,
      color-mix(in srgb, var(--rock) 60%, black) 100%);
    clip-path: polygon(0% 100%, 3% 52%, 11% 32%, 22% 18%, 34% 10%,
                       48% 13%, 62% 24%, 76% 42%, 90% 66%, 100% 100%);
  }
  #rock::after {   /* highlight along the peak */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.28) 0 18%, transparent 40%);
  }

  /* ---------- diver ---------- */
  #diver {
    position: absolute; top: 0; left: 0; width: 14px; height: 46px;
    will-change: transform, opacity;
  }
  #squash { position: absolute; inset: 0; transform-origin: 50% 100%; }
  #diver i { position: absolute; background: var(--man); border-radius: 2px; }
  .head { top: 0; left: 0; width: 14px; height: 14px; border-radius: 50% !important; }
  .torso { top: 13px; left: 6px; width: 3px; height: 20px; }
  .arm { top: 14px; left: 7px; width: 19px; height: 3px; transform-origin: left center; }
  .arm.l { rotate: -145deg; }
  .arm.r { rotate: 145deg; }
  .leg-l { top: 31px; left: 5px; width: 3px; height: 15px; rotate: 12deg; }
  .leg-r { top: 31px; left: 8px; width: 3px; height: 15px; rotate: -12deg; }

  /* ---------- ketchup ---------- */
  .drop {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: color-mix(in srgb, var(--water) 35%, white);
  }
  .drop.ketchup { background: var(--ketchup); }
  .stain {
    position: absolute; pointer-events: none; background: var(--ketchup);
    border-radius: 50% 40% 55% 45%;
    transition: opacity 2.5s linear;
  }

  footer {
    position: absolute; bottom: 10px; left: 50%; translate: -50% 0;
    font-size: 12px; color: color-mix(in srgb, var(--man) 55%, transparent);
    user-select: none;
  }
</style>
</head>
<body>
<div id="stage">
  <h1>justjump<span>.lol</span></h1>

  <div id="rig">
    <div class="ladder">
      <div class="rail"></div>
      <div class="rail r"></div>
      <div class="rungs"></div>
    </div>
    <div id="board"></div>
    <div id="tip"></div>
  </div>

  <div id="diver">
    <div id="squash">
      <i class="head"></i><i class="arm l"></i><i class="arm r"></i>
      <i class="torso"></i><i class="leg-l"></i><i class="leg-r"></i>
    </div>
  </div>

  <div id="water"></div>
  <div id="rock"></div>
  <footer>placeholder site. that's ketchup. he's fine.</footer>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const diver = document.getElementById('diver');
  const squash = document.getElementById('squash');
  const board = document.getElementById('board');
  const rock  = document.getElementById('rock');
  const tip   = document.getElementById('tip');

  const GRAVITY = 1500;   // px/s²
  const LEAP    = -420;   // px/s upward kick
  const rand = (a, b) => a + Math.random() * (b - a);

  // Measured once, and again on resize.
  let startX = 0, startY = 0, landY = 0;
  function measure() {
    const s = stage.getBoundingClientRect();
    const t = tip.getBoundingClientRect();
    const r = rock.getBoundingClientRect();
    startX = t.left - s.left - 4;
    startY = t.top - s.top - 44;                      // feet on the board
    landY  = (r.top - s.top) + r.height * 0.13 - 44;  // peak of the rock
  }
  measure();
  addEventListener('resize', measure, { passive: true });

  // Diver state
  let phase = 'stand', t = 0;
  let x = 0, y = 0, vx = 0, vy = 0, rot = 0, spin = 0, alpha = 1;
  let sx = 1, sy = 1;
  let fromX = 0, fromY = 0;

  // Board spring
  let angle = 0, angleVel = 0;
  function spring(dt, target) {
    angleVel += ((target - angle) * 260 - angleVel * 14) * dt;
    angle += angleVel * dt;
  }

  function ketchup() {
    const frag = document.createDocumentFragment();

    // airborne spray
    for (let i = 0; i < 18; i++) {
      const d = document.createElement('div');
      const size = rand(4, 13);
      d.className = 'drop ketchup';
      d.style.cssText = `width:${size}px;height:${size}px;left:${x + rand(-10, 10)}px;top:${landY + 38}px`;
      frag.appendChild(d);
      d.animate(
        [{ transform: 'translate(0,0) scale(1)', opacity: 1 },
         { transform: `translate(${rand(-130, 130)}px,${rand(-120, -30)}px) scale(.4)`, opacity: 0 }],
        { duration: rand(500, 950), easing: 'cubic-bezier(.2,.7,.4,1)' }
      ).onfinish = () => d.remove();
    }

    // stains that soak into the rock, then fade
    for (let i = 0; i < 7; i++) {
      const st = document.createElement('div');
      const w = rand(10, 30);
      st.className = 'stain';
      st.style.cssText =
        `width:${w}px;height:${w * rand(.4, .8)}px;opacity:.85;` +
        `left:${x + rand(-55, 55)}px;top:${landY + rand(34, 56)}px;` +
        `rotate:${rand(0, 360)}deg`;
      frag.appendChild(st);
      setTimeout(() => { st.style.opacity = '0'; }, 400);
      setTimeout(() => st.remove(), 3200);
    }

    stage.appendChild(frag);
  }

  const next = (p) => { phase = p; t = 0; };

  function update(dt) {
    t += dt;

    switch (phase) {
      case 'stand':                        // appear on the board and pause
        x = startX; y = startY; rot = 0; sx = 1; sy = 1;
        alpha = Math.min(t / 0.3, 1);
        spring(dt, 0);
        if (t > 1.0) next('crouch');
        break;

      case 'crouch':                       // settle on the board, dip it
        x = startX; y = startY; rot = 0; alpha = 1;
        spring(dt, -6);
        if (t > 0.35) { 
          vx = rand(25, 70); vy = LEAP; spin = rand(300, 560);
          angleVel = 70;                   // board springs back
          next('flight');
        }
        break;

      case 'flight':                       // ballistic fall
        vy += GRAVITY * dt;
        x += vx * dt; y += vy * dt; rot += spin * dt;
        spring(dt, 0);
        if (y >= landY) {                  // meets rock
          y = landY; rot = 0;
          sx = 2.0; sy = 0.18;
          ketchup();
          next('splat');
        }
        break;

      case 'splat':                        // flattened on the rock
        spring(dt, 0);
        y = landY;
        if (t > 0.9) { fromX = x; fromY = y; next('peel'); }
        break;

      case 'peel': {                       // unflatten, then fade out
        const k = Math.min(t / 0.8, 1);
        sx = 2.0 + (1 - 2.0) * k;
        sy = 0.18 + (1 - 0.18) * k;
        alpha = 1 - k;
        if (k === 1) { sx = sy = 1; next('climb'); }
        break;
      }

      case 'climb': {                      // drift back up to the board
        const k = Math.min(t / 0.5, 1);
        x = fromX + (startX - fromX) * k;
        y = fromY + (startY - fromY) * k;
        rot = 0; alpha = 0;
        if (k === 1) next('stand');
        break;
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);  // clamp after tab switches
    last = now;
    update(dt);
    diver.style.transform = `translate(${x - 7}px, ${y}px) rotate(${rot}deg)`;
    diver.style.opacity = alpha;
    squash.style.transform = `scale(${sx}, ${sy})`;
    board.style.transform = `rotate(${angle}deg)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
